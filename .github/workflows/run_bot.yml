name: Моніторинг ВРУ

on:
  workflow_dispatch: # Саме це вмикає кнопку "Run workflow" у вкладці Actions
  schedule:
    - cron: '*/30 * * * *' # кожні 30 хв (час UTC)

permissions:
  contents: write # потрібно, щоб закомітувати state.json назад у репозиторій

# Окремі черги для ручних і планових запусків: плановий запуск не витісняє ручний.
concurrency:
  group: vru-bot-run-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run-bot:
    # У Settings → Secrets and variables → Actions / Variables можна перемикати MONITORING_ENABLED.
    if: github.event_name == 'workflow_dispatch' || vars.MONITORING_ENABLED != 'false'
    runs-on: ubuntu-latest # Використовуємо стандартний сервер GitHub

    steps:
      - name: Завантаження коду з репозиторію
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Перевірка синтаксису Python
        run: python -m compileall -q bot.py vru_api.py analysis.py

      - name: Запуск бота (один прохід)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Тимчасово тестуємо безкоштовну модель, щоб перевірити, чи причина в доступі до платної моделі/кредитах.
          OPENROUTER_MODEL: google/gemma-3-4b-it:free
        run: python bot.py

      - name: Збереження стану (state.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Якщо є зміни, робимо коміт і пуш. Якщо ні — нічого не робимо.
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push
